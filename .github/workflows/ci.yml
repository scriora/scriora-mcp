name: CI - scriora-mcp

on:
  pull_request:
    branches: [main, develop]
    
  push:
    branches: [main]
    
  merge_group:
  workflow_dispatch:
concurrency:
  group: ci-mcp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript / Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck

  lint:
    name: Biome / Lint and Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm lint

  unit-tests:
    name: Tests / Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm vitest run test/unit/ --coverage --passWithNoTests

  contract-tests:
    name: Tests / Contract (MCP Protocol)
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm vitest run test/contract/ --passWithNoTests

  security-tests:
    name: Tests / Security (Approval Gate + Cross-Tenant)
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm vitest run test/security/ --passWithNoTests

  build:
    name: Build / Compile
    runs-on: ubuntu-latest
    needs: [typecheck, lint, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build

  docker:
    name: Build / Docker Image
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t scriora-mcp:ci .


